<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#4c1d95">
<title>QuizLive</title>
<style>
:root { --ink:#1e1b4b; --muted:#6b6a85; --bg:#f4f2fb; --card:#fff; --line:#e6e2f3; --accent:#5b21b6; --orange:#f97316; --team:#5b21b6; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; min-height:100%; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--ink); }
.logo { font-weight:900; letter-spacing:-.5px; color:var(--accent); }
.logo span { color:var(--orange); }
.btn { font:inherit; font-weight:800; font-size:17px; border:0; border-radius:12px; padding:13px 22px; cursor:pointer; background:var(--accent); color:#fff; }
.btn:hover { filter:brightness(1.08); }
.btn.big { font-size:24px; padding:18px 40px; border-radius:16px; }
.btn.ghost { background:#ece8f8; color:var(--accent); }
.btn.red { background:#fee2e2; color:#b91c1c; }
.small { font-size:14px; color:var(--muted); line-height:1.45; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 20px; border-radius:12px; font-size:15px; display:none; z-index:50; max-width:90vw; text-align:center; }
/* ===== player ===== */
#papp { min-height:100vh; display:flex; flex-direction:column; }
.center { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:28px 22px; text-align:center; }
.center .logo { font-size:32px; margin-bottom:6px; }
.sub { color:var(--muted); font-size:16px; margin:0 0 22px; }
.pin { width:100%; max-width:340px; font-size:22px; padding:16px 18px; border:2px solid #d8d3ee; border-radius:14px; outline:none; text-align:center; background:#fff; color:var(--ink); font-family:inherit; }
.pin:focus { border-color:var(--accent); }
.pin.code { text-transform:uppercase; letter-spacing:6px; font-weight:800; }
.pbtn { display:block; width:100%; max-width:340px; margin-top:14px; font-size:20px; font-weight:800; padding:16px; border:0; border-radius:14px; background:var(--accent); color:#fff; font-family:inherit; }
.err { color:#dc2626; margin-top:12px; min-height:20px; }
.bigt { font-size:26px; font-weight:800; margin:10px 0 4px; }
.pulse { width:16px; height:16px; border-radius:50%; background:var(--accent); margin:18px auto; animation:p 1.4s infinite; }
@keyframes p { 0%{transform:scale(.8);opacity:.5} 50%{transform:scale(1.3);opacity:1} 100%{transform:scale(.8);opacity:.5} }
.teamcard { width:100%; max-width:380px; border-radius:22px; padding:26px 20px; color:#fff; background:var(--team); box-shadow:0 10px 30px rgba(0,0,0,.15); }
.teamcard .emoji { font-size:72px; line-height:1; }
.teamcard .tname { font-size:34px; font-weight:900; margin-top:6px; }
.mates { margin-top:16px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.mate { background:rgba(255,255,255,.22); padding:7px 12px; border-radius:999px; font-weight:700; font-size:16px; }
.mate.me { background:#fff; color:var(--team); }
.hint { margin-top:18px; font-size:17px; color:var(--muted); }
.pbar { background:var(--team); color:#fff; padding:12px 16px 14px; }
.pbar .row { display:flex; justify-content:space-between; align-items:center; font-weight:800; font-size:17px; }
.dots { display:flex; gap:4px; margin-top:10px; }
.dot { flex:1; height:8px; border-radius:4px; background:rgba(255,255,255,.3); }
.dot.on { background:#fff; }
.qwrap { padding:20px 16px 8px; }
.qtext { background:#fff; border-radius:18px; padding:20px 18px; font-size:21px; line-height:1.45; font-weight:600; box-shadow:0 2px 10px rgba(30,27,75,.06); }
.blank { display:inline-block; min-width:56px; border-bottom:3px solid var(--team); margin:0 3px; }
.opts { padding:10px 16px 24px; display:grid; gap:12px; }
.opt { font-family:inherit; font-size:21px; font-weight:800; padding:20px 14px; border-radius:16px; border:0; color:#fff; text-align:center; box-shadow:0 4px 0 rgba(0,0,0,.18); }
.opt:active { transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.18); }
.opt.c0 { background:#7c3aed; } .opt.c1 { background:#0ea5e9; } .opt.c2 { background:#f97316; } .opt.c3 { background:#10b981; } .opt.c4 { background:#ec4899; } .opt.c5 { background:#64748b; }
.opt[disabled] { opacity:.45; }
.none { text-align:center; padding:26px 20px; color:var(--muted); font-size:18px; line-height:1.45; }
.none b { color:var(--ink); font-size:21px; display:block; margin-bottom:6px; }
.fb { position:fixed; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:24px; text-align:center; color:#fff; z-index:10; animation:fin .15s ease-out; }
.fb.ok { background:#10b981; } .fb.bad { background:#dc2626; }
.fb .ic { font-size:84px; line-height:1; font-weight:900; }
.fb .t { font-size:30px; font-weight:900; margin:8px 0 14px; }
.fb .d { font-size:18px; line-height:1.5; max-width:420px; }
.fb .ans { display:inline-block; background:#fff; color:#b91c1c; border-radius:10px; padding:2px 10px; font-weight:900; }
.fb .q { margin-top:18px; font-size:18px; line-height:1.45; background:rgba(255,255,255,.14); border-radius:14px; padding:12px 14px; max-width:420px; }
.fb .q u { text-decoration:none; border-bottom:3px solid #fff; font-weight:900; }
@keyframes fin { from{opacity:0; transform:scale(1.04)} to{opacity:1; transform:none} }
.trophy { font-size:90px; line-height:1; }
.stats { display:flex; gap:12px; margin-top:20px; }
.stat { background:#fff; border-radius:14px; padding:12px 18px; min-width:96px; }
.stat b { display:block; font-size:28px; }
.net { position:fixed; left:0; right:0; bottom:0; background:#1e1b4b; color:#fff; text-align:center; font-size:14px; padding:8px; display:none; z-index:20; }
.tlink { margin-top:34px; font-size:14px; color:var(--muted); }
.tlink a { color:var(--muted); }
/* ===== host ===== */
header { display:flex; align-items:center; gap:18px; padding:14px 28px; background:#fff; border-bottom:1px solid var(--line); }
header .logo { font-size:24px; }
header .info { color:var(--muted); font-size:15px; }
header .sp { flex:1; }
header .mini { font-size:18px; font-weight:800; }
.conn { display:flex; gap:6px; font-size:13px; color:var(--muted); align-items:center; }
.conn i { display:inline-block; width:9px; height:9px; border-radius:50%; background:#d1d5db; margin-right:3px; }
.conn i.ok { background:#10b981; } .conn i.wait { background:#f59e0b; }
main { padding:26px 28px 40px; max-width:1500px; margin:0 auto; }
.card { background:var(--card); border-radius:20px; padding:22px 24px; box-shadow:0 2px 14px rgba(30,27,75,.06); }
h2 { margin:0 0 14px; font-size:20px; }
.row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
.lobby { display:grid; grid-template-columns: 1.35fr 1fr; gap:24px; align-items:start; }
.join { display:flex; gap:28px; align-items:center; }
.qr { width:300px; height:300px; flex:none; background:#fff; border-radius:16px; padding:6px; border:1px solid var(--line); }
.qr svg { width:100%; height:100%; display:block; }
.join .lbl { font-size:17px; color:var(--muted); margin-bottom:4px; }
.join .url { font-size:28px; font-weight:800; word-break:break-all; line-height:1.15; }
.join .code { font-size:64px; font-weight:900; letter-spacing:8px; line-height:1.1; color:var(--accent); }
.players { margin-top:22px; }
.players h2 .n { display:inline-block; background:var(--accent); color:#fff; border-radius:999px; padding:2px 12px; margin-left:6px; font-size:17px; }
.chips { display:flex; flex-wrap:wrap; gap:10px; min-height:44px; }
.chip { background:#fff; border:2px solid var(--line); border-radius:999px; padding:8px 8px 8px 16px; font-weight:700; font-size:18px; display:flex; align-items:center; gap:6px; animation:pop .25s ease-out; }
.chip.off { opacity:.4; }
.chip button { border:0; background:#f1eef9; color:var(--muted); width:26px; height:26px; border-radius:50%; cursor:pointer; font-size:15px; line-height:1; }
.chip button:hover { background:#fee2e2; color:#b91c1c; }
@keyframes pop { from { transform:scale(.6); opacity:0 } to { transform:none; opacity:1 } }
.empty { color:var(--muted); font-size:17px; padding:8px 0; }
.set label.opt2 { display:flex; align-items:center; gap:10px; padding:6px 0; font-size:16px; cursor:pointer; }
.seg { display:flex; background:#f1eef9; border-radius:12px; padding:4px; margin-bottom:16px; }
.seg button { flex:1; font:inherit; font-weight:800; border:0; background:transparent; padding:11px 8px; border-radius:9px; cursor:pointer; color:var(--muted); font-size:15px; }
.seg button.on { background:#fff; color:var(--accent); box-shadow:0 1px 4px rgba(0,0,0,.08); }
.field { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); font-size:16px; }
.field input[type=number] { width:80px; font:inherit; font-weight:800; font-size:18px; padding:6px 8px; border:2px solid var(--line); border-radius:10px; text-align:center; }
.field input[type=text] { font:inherit; padding:7px 9px; border:2px solid var(--line); border-radius:10px; max-width:280px; width:100%; }
.parts { max-height:260px; overflow:auto; margin:6px 0 4px; }
.parts label { display:flex; gap:10px; align-items:flex-start; padding:5px 0; font-size:15px; cursor:pointer; }
.parts .c { color:var(--muted); margin-left:auto; white-space:nowrap; }
.warn { background:#fff7ed; color:#9a3412; border-radius:10px; padding:10px 12px; font-size:14px; margin-top:10px; }
details summary { cursor:pointer; color:var(--accent); font-weight:700; font-size:15px; padding:8px 0; }
textarea { width:100%; min-height:160px; font:13px/1.4 Consolas,monospace; border:2px solid var(--line); border-radius:10px; padding:8px; }
.teams { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; margin-top:20px; }
.team { border-radius:20px; padding:20px; color:#fff; }
.team .e { font-size:46px; line-height:1; }
.team .n { font-size:26px; font-weight:900; margin:6px 0 12px; }
.team .m { display:flex; flex-wrap:wrap; gap:6px; }
.team .m span { background:rgba(255,255,255,.22); border-radius:999px; padding:5px 11px; font-weight:700; }
.team .m span.off { opacity:.5; text-decoration:line-through; }
.track { display:flex; flex-direction:column; gap:14px; margin-top:20px; }
.lane { display:grid; grid-template-columns: 290px 1fr 70px; gap:18px; align-items:center; background:#fff; border-radius:18px; padding:14px 18px; box-shadow:0 2px 10px rgba(30,27,75,.05); }
.lane .who .n { font-weight:900; font-size:22px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lane .who .m { color:var(--muted); font-size:14px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rail { position:relative; height:34px; background:#f1eef9; border-radius:17px; overflow:hidden; }
.fill { position:absolute; left:0; top:0; bottom:0; border-radius:17px; transition:width .5s cubic-bezier(.3,1.4,.5,1); min-width:34px; }
.runner { position:absolute; right:6px; top:50%; transform:translateY(-50%); font-size:22px; }
.score { font-size:28px; font-weight:900; text-align:right; }
.lane.ok { box-shadow:0 0 0 4px #10b981; }
.lane.bad { box-shadow:0 0 0 4px #ef4444; animation:shake .4s; }
@keyframes shake { 0%,100%{transform:none} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.finish { position:absolute; right:0; top:0; bottom:0; width:6px; background:repeating-linear-gradient(0deg,#1e1b4b 0 6px,#fff 6px 12px); }
.win { text-align:center; padding:28px 20px 34px; border-radius:24px; color:#fff; }
.win .e { font-size:90px; line-height:1; }
.win .t { font-size:46px; font-weight:900; margin-top:6px; }
.win .s { font-size:19px; opacity:.9; margin-top:6px; }
.cols { display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:24px; align-items:start; }
table { width:100%; border-collapse:collapse; font-size:16px; }
td, th { padding:9px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
th { color:var(--muted); font-weight:700; font-size:14px; }
td.num { text-align:right; font-weight:800; white-space:nowrap; }
.ansb { background:#dcfce7; color:#166534; padding:1px 8px; border-radius:6px; font-weight:800; white-space:nowrap; }
@media (max-width: 1000px) { .lobby,.cols { grid-template-columns:1fr; } .join { flex-direction:column; align-items:flex-start; } .lane { grid-template-columns:1fr; } }
